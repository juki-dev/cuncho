<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catación · Paso 2 · Grano</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FAF5EE;font-family:Manrope,system-ui,sans-serif;color:#3C2A21}
a{color:#B24F2B}a:hover{color:#8F3D1E}
input::placeholder{color:#9A8572}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF5EE; font-family: Manrope, system-ui, sans-serif; color: #3C2A21">

<header style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Paso1.dc.html" aria-label="Volver" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #EADBC8; background: #FFFDF9; display: flex; align-items: center; justify-content: center; color: #3C2A21">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #7A6352">Paso 2 de 3 · Ficha técnica</span>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 700; color: #2C1810">¿Qué grano es?</h1>
</div>
</div>
<div style="display: flex; gap: 6px" aria-hidden="true">
<span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #C85A32"></span>
<span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #C85A32"></span>
<span style="flex-grow: 1; height: 4px; border-radius: 2px; background: #EADBC8"></span>
</div>
</header>

<main style="padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="variedad" style="font-size: 13px; font-weight: 800; color: #2C1810">Nombre del café / Variedad</label>
<input id="variedad" type="text" placeholder="Ej. Geisha, Bourbon Rosado" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #E5D5C5; background: #FFFDF9; font-family: Manrope, sans-serif; font-size: 15px; color: #2C1810; box-sizing: border-box">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{varieties}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="finca" style="font-size: 13px; font-weight: 800; color: #2C1810">Finca / Región</label>
<input id="finca" type="text" placeholder="Ej. Finca La Esperanza · Pitalito, Huila" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #E5D5C5; background: #FFFDF9; font-family: Manrope, sans-serif; font-size: 15px; color: #2C1810; box-sizing: border-box">
</div>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 800; color: #2C1810">Proceso</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{processes}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 800; color: #2C1810">Método de preparación</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{methods}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</fieldset>
</main>

<footer style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 28px; background: #FAF5EE; border-top: 1px solid #EADBC8">
<a href="Paso3.dc.html" style="height: 56px; border-radius: 16px; background: #B24F2B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Continuar a la evaluación</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { variety: 'Bourbon Rosado', process: 'Anaeróbico', method: 'Aeropress' }; }
  renderVals() {
    const chip = (on, full) => 'min-height: 44px; padding: 0 16px; border-radius: 22px; cursor: pointer; font-family: Manrope, system-ui, sans-serif; font-size: 14px; font-weight: ' + (on ? '800' : '600') + '; border: 1px solid ' + (on ? '#C85A32' : '#EADBC8') + '; background: ' + (on ? '#F8E6DC' : '#FFFDF9') + '; color: ' + (on ? '#8F3D1E' : '#3C2A21') + (full ? '; width: 100%' : '');
    const group = (labels, key, full) => labels.map((label) => {
      const on = this.state[key] === label;
      return { label, on: on ? 'true' : 'false', style: chip(on, full), pick: () => this.setState({ [key]: label }) };
    });
    return {
      varieties: group(['Geisha', 'Bourbon Rosado', 'Castillo', 'Caturra'], 'variety', false),
      processes: group(['Lavado', 'Natural', 'Honey', 'Anaeróbico'], 'process', true),
      methods: group(['V60', 'Aeropress', 'Espresso', 'Chemex', 'Prensa Francesa'], 'method', false)
    };
  }
}
</script>
</body>
</html>
