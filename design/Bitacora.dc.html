<span style="font-size: 13px; color: #5E4838">{{e.grain}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px">
<sc-for list="{{e.notes}}" as="n" hint-placeholder-count="3">
<span style="padding: 3px 9px; border-radius: 10px; background: #F5EADF; color: #5E4838; font-size: 11px; font-weight: 700">{{n}}</span>
