<button type="button" onClick="{{pickCable}}" aria-label="Tostadores del Cable, 86 puntos" style="position: absolute; left: 290px; top: 596px; width: 44px; height: 44px; border-radius: 22px; background: #3C2A21; color: #FFFFFF; border: 3px solid #FFFDF9; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 800; box-shadow: 0 6px 14px rgba(44, 24, 16, 0.3); cursor: pointer">86</button>

<div style="position: absolute; left: 222px; top: 402px; width: 56px; height: 56px">
<span style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 28px; background: rgba(224, 122, 95, 0.55); animation: cmPulse 2.2s ease-out infinite"></span>
<span style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 28px; background: rgba(224, 122, 95, 0.4); animation: cmPulse 2.2s ease-out 1.1s infinite"></span>
<button type="button" onClick="{{pickOrigen}}" aria-label="Recomendado: Origen Cafetería, 92 puntos" style="position: absolute; left: 0; top: 0; width: 56px; height: 56px; border-radius: 28px; background: #B24F2B; color: #FFFFFF; border: 3px solid #FFFDF9; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 800; box-shadow: 0 8px 18px rgba(178, 79, 43, 0.45); cursor: pointer">92</button>
</div>

<div style="{{popupStyle}}">
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 3px">
<sc-if value="{{sel.rec}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #B24F2B">Recomendado para ti</span>
</sc-if>

</div>
<div style="display: flex; flex-direction: column; align-items: center; padding: 6px 10px; border-radius: 12px; background: #FAF5EE; border: 1px solid #EADBC8">
<span style="font-size: 18px; font-weight: 800; color: #2C1810; line-height: 1">{{sel.score}}</span>
<span style="font-size: 10px; font-weight: 700; color: #7A6352">pts</span>
</div>
</div>
<div style="font-size: 13px; font-weight: 600; color: #5E4838">{{sel.method}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{sel.notes}}" as="n" hint-placeholder-count="3">
<span style="padding: 4px 10px; border-radius: 12px; background: #F5EADF; color: #5E4838; font-size: 12px; font-weight: 600">{{n}}</span>
</sc-for>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'origen' }; }
  renderVals() {
    const cafes = {
      origen: { name: 'Origen Cafetería', score: '92', method: 'Aeropress · Bourbon Rosado · Anaeróbico', notes: ['Frutos Rojos', 'Hibisco', 'Cítricos'], rec: true, x: 250, y: 430 },
      laureles: { name: 'Café Laureles', score: '89', method: 'V60 · Geisha · Lavado', notes: ['Jazmín', 'Bergamota', 'Durazno'], rec: false, x: 95, y: 250 },
      cable: { name: 'Tostadores del Cable', score: '86', method: 'Chemex · Castillo · Honey', notes: ['Panela', 'Caramelo', 'Naranja'], rec: false, x: 312, y: 618 },
      mesa: { name: 'La Mesa del Barista', score: '84', method: 'Espresso · Caturra · Natural', notes: ['Chocolate Negro', 'Nuez'], rec: false, x: 170, y: 560 }
    };
    const sel = cafes[this.state.sel];
    const w = 250, h = 150;
    const left = Math.max(16, Math.min(390 - w - 16, sel.x - w / 2));
    const top = sel.y < 360 ? sel.y + 34 : sel.y - h - 40;
    const popupStyle = 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + w + 'px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: #FFFDF9; border: 1px solid #EADBC8; border-radius: 18px; box-shadow: 0 14px 34px rgba(60, 42, 33, 0.2)';
    const pick = (id) => () => this.setState({ sel: id });
    return { sel, popupStyle, pickOrigen: pick('origen'), pickLaureles: pick('laureles'), pickCable: pick('cable'), pickMesa: pick('mesa') };
  }
}
</script>
</body>
