name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "deploy/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/ci-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez y nunca se cancela uno en curso.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/juki-dev/cuncho-api

jobs:
  # No se despliega código que no pasó CI.
  ci:
    uses: ./.github/workflows/ci-api.yml

  build:
    name: Imagen en GHCR
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          target: runtime
          platforms: linux/amd64 # Lightsail es x86
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue por SSH
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production # aprobación requerida y secretos se configuran en GitHub
    env:
      TAG: ${{ needs.build.outputs.tag }}
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar configuración del environment
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          faltan=0
          for v in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_USER API_URL; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v en el environment production"; faltan=1; fi
          done
          exit $faltan

      # El servidor se verifica con SSH_KNOWN_HOSTS; nunca StrictHostKeyChecking=no.
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copiar archivos de deploy/ al servidor
        run: |
          tar -C deploy --exclude='.env*' -cf - docker-compose.prod.yml Caddyfile scripts \
            | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'tar -C /opt/cuncho -xf -'

      - name: Desplegar ${{ needs.build.outputs.tag }}
        run: ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "/opt/cuncho/scripts/deploy.sh '$TAG'"

      - name: Smoke test de /health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "$API_URL/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$API_URL/health no responde"; exit 1
